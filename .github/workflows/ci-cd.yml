name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Lint & Validasi Python
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Upgrade Pip
        continue-on-error: true
        run: |
          python --version
          python -m pip install --upgrade pip --break-system-packages

      - name: Install Dependencies
        continue-on-error: true
        run: |
          python -m pip install -r bot/requirements.txt --break-system-packages
          python -m pip install pytest ruff --break-system-packages

      - name: Validasi Kode (Lint)
        continue-on-error: true
        run: |
          python -m ruff check bot/

      - name: Jalankan Unit Tests
        run: |
          python -m pytest bot/tests/

      - name: Validasi Docker Compose
        continue-on-error: true
        run: |
          if command -v docker &> /dev/null; then
            docker compose -f docker-compose.yml config --quiet
          else
            echo "Docker not available, skipping compose validation"
          fi

  # ============================================
  # Job 2: Build & Upload Artifact Bawaan GitHub
  # ============================================
  package:
    if: github.event.action != 'closed'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            bot/
            docker-compose.yml
            docker-compose.standalone.yml
            store_knowledge.txt
            unanswered_questions.txt
            .env.example
          include-hidden-files: true
          retention-days: 7

  # ============================================
  # Job 3: Deploy Preview / Staging (HANYA saat PR ke branch main -> Run di Windows Runner)
  # ============================================
  deploy-preview:
    needs: package
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: [self-hosted, windows]
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./

      - name: Deploy Preview Container
        shell: powershell
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGING_GINEE_USERNAME: ${{ secrets.STAGING_GINEE_USERNAME }}
          STAGING_GINEE_PASSWORD: ${{ secrets.STAGING_GINEE_PASSWORD }}
        run: |
          Write-Output "Deploying PR #$env:PR_NUMBER preview to Windows Staging..."

          # Hapus container preview lama jika ada
          docker rm -f ginee-bot 2>&1 | Out-Null

          $files = "store_knowledge.txt", "unanswered_questions.txt"
          foreach ($file in $files) {
              if (-not (Test-Path $file)) {
                  New-Item -ItemType File -Name $file -Force | Out-Null
              }
          }
          
          if (-not (Test-Path ".env")) {
              Copy-Item ".env.example" -Destination ".env"
          }

          # Inject staging secrets
          $envContent = Get-Content .env
          if (-not [string]::IsNullOrWhiteSpace($env:STAGING_GINEE_USERNAME)) {
              $envContent = $envContent -replace "^GINEE_USERNAME=.*", "GINEE_USERNAME=$env:STAGING_GINEE_USERNAME"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STAGING_GINEE_PASSWORD)) {
              $envContent = $envContent -replace "^GINEE_PASSWORD=.*", "GINEE_PASSWORD=$env:STAGING_GINEE_PASSWORD"
          }
          $envContent | Set-Content .env

          Write-Output "Building & starting preview container locally on Windows..."
          docker network create autochat_default 2>&1 | Out-Null

          $ollamaExists = $false
          try {
              $null = docker inspect ollama 2>$null
              if ($LASTEXITCODE -eq 0) { $ollamaExists = $true }
          } catch {
              $ollamaExists = $false
          }

          if ($ollamaExists) {
              Write-Output "Container 'ollama' exists. Preparing shared Ollama instance..."
              $isRunning = (docker inspect -f '{{.State.Running}}' ollama 2>$null) -eq "true"
              if (-not $isRunning) {
                  Write-Output "Starting existing 'ollama' container..."
                  docker start ollama 2>&1 | Out-Null
              }

              $networks = docker inspect -f '{{json .NetworkSettings.Networks}}' ollama 2>$null
              if ($networks -notlike '*autochat_default*') {
                  Write-Output "Connecting 'ollama' container to autochat_default network..."
                  docker network connect autochat_default ollama 2>&1 | Out-Null
              }

              $models = docker exec ollama ollama list 2>$null
              if ($models -notlike '*qwen2.5:3b*') {
                  Write-Output "Pulling qwen2.5:3b model into existing 'ollama' container..."
                  docker exec ollama ollama pull qwen2.5:3b
              }

              Write-Output "Shared Ollama is ready. Deploying with docker-compose.yml..."
              docker compose -f docker-compose.yml up -d --build --remove-orphans
          } else {
              Write-Output "No existing 'ollama' container found. Starting standalone configuration with Ollama..."
              docker compose -f docker-compose.standalone.yml up -d --build --remove-orphans
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          docker image prune -f 2>&1 | Out-Null

          Write-Output "Preview berhasil di-deploy ke Windows Staging via docker-compose!"

  # ============================================
  # Job 4: Cleanup Preview Container (Windows Staging)
  # ============================================
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: [self-hosted, windows]
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./

      - name: Stop Preview Container
        continue-on-error: true
        shell: powershell
        run: |
          Write-Output "PR closed. Stopping Windows preview container..."
          docker rm -f ginee-bot 2>&1 | Out-Null
          docker compose down 2>&1 | Out-Null

  # ============================================
  # Job 5: Deploy Production (HANYA push ke main)
  # ============================================
  deploy:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: /home/gpu/actions-runner-autochat/runner-autochattiktok/autochattiktok

      - name: Deploy to Production
        shell: bash
        env:
          GINEE_USERNAME: ${{ secrets.GINEE_USERNAME }}
          GINEE_PASSWORD: ${{ secrets.GINEE_PASSWORD }}
        run: |
          TARGET_DIR="/home/gpu/actions-runner-autochat/runner-autochattiktok/autochattiktok"

          echo "Deploying autochattiktok to production..."

          mkdir -p "$TARGET_DIR"
          cd "$TARGET_DIR"

          [ -f "store_knowledge.txt" ] || touch "store_knowledge.txt"
          [ -f "unanswered_questions.txt" ] || touch "unanswered_questions.txt"

          # Ensure .env file always exists
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Inject secrets into .env if present
          if [ -n "$GINEE_USERNAME" ]; then
            sed -i "s/^GINEE_USERNAME=.*/GINEE_USERNAME=$GINEE_USERNAME/" .env || echo "GINEE_USERNAME=$GINEE_USERNAME" >> .env
          fi
          if [ -n "$GINEE_PASSWORD" ]; then
            sed -i "s/^GINEE_PASSWORD=.*/GINEE_PASSWORD=$GINEE_PASSWORD/" .env || echo "GINEE_PASSWORD=$GINEE_PASSWORD" >> .env
          fi

          # Force DRY_RUN=false for production
          sed -i "s/^DRY_RUN=.*/DRY_RUN=false/" .env || echo "DRY_RUN=false" >> .env

          docker rm -f ginee-bot 2>/dev/null || true

          echo "Building & starting production container..."
          docker network create autochat_default 2>/dev/null || true

          if docker inspect ollama >/dev/null 2>&1; then
              echo "Container 'ollama' exists. Preparing shared Ollama instance..."
              IS_RUNNING=$(docker inspect -f '{{.State.Running}}' ollama 2>/dev/null || echo "false")
              if [ "$IS_RUNNING" != "true" ]; then
                  echo "Starting existing 'ollama' container..."
                  docker start ollama
              fi

              if docker inspect -f '{{json .NetworkSettings.Networks}}' ollama 2>/dev/null | grep "autochat_default" >/dev/null 2>&1; then
                  echo "Ollama is already connected to autochat_default network."
              else
                  echo "Connecting 'ollama' container to autochat_default network..."
                  docker network connect autochat_default ollama 2>/dev/null || true
              fi

              if docker exec ollama ollama list 2>/dev/null | grep "qwen2.5:3b" >/dev/null 2>&1; then
                  echo "Model qwen2.5:3b is already available in Ollama."
              else
                  echo "Pulling qwen2.5:3b model into existing 'ollama' container..."
                  docker exec ollama ollama pull qwen2.5:3b
              fi

              echo "Shared Ollama is ready. Deploying with docker-compose.yml..."
              docker compose -f docker-compose.yml up -d --build --remove-orphans
          else
              echo "No existing 'ollama' container found. Starting standalone configuration with Ollama..."
              docker compose -f docker-compose.standalone.yml up -d --build --remove-orphans
          fi
          docker image prune -f

          echo -e "\nDeploy production selesai!\nnoVNC: http://<SERVER_IP>:6085"
